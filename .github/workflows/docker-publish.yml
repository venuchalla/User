
name: Test and Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: master-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and Publish Maven and Docker
    runs-on: ubuntu-latest

    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Configure Java and Maven credentials
      - name: Set up Java 19
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '19'
          cache: maven
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GITHUB_TOKEN

      # 3. Build, test and publish JAR
      - name: Build, Test and Publish Maven Package
        shell: bash
        run: |
          mvn -B -ntp clean deploy \
            -DaltDeploymentRepository="github::https://maven.pkg.github.com/${GITHUB_REPOSITORY}"

      # 4. Verify generated JAR
      - name: Verify JAR file
        shell: bash
        run: |
          echo "Checking generated JAR..."

          find target -maxdepth 1 -name "*.jar" -type f

          if ! compgen -G "target/*.jar" > /dev/null; then
            echo "::error::JAR file not found"
            exit 1
          fi

      - name: Prepare Docker JAR
        shell: bash
        run: |
          cp target/user-*-SNAPSHOT.jar target/app.jar

      # 5. Configure Docker image name
      - name: Configure Docker image name
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Docker image: $IMAGE"

      # 6. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Login to GHCR using GitHub Token
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Build and push Docker image
      - name: Build and Push Docker Image
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:build-${{ github.run_number }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # 9. Display publishing summary
      - name: Publish Summary
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.docker.outputs.digest }}
        run: |
          {
            echo "## Build and Publish Successful"
            echo ""
            echo "### Maven Package"
            echo "Published to GitHub Maven Packages"
            echo ""
            echo "### Docker Image"
            echo "$IMAGE:latest"
            echo ""
            echo "### Build Tag"
            echo "$IMAGE:build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            echo ""
            echo "### Docker Digest"
            echo "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
        
         # 9. Delete older Docker image versions
      - name: Cleanup old GHCR images
        uses: actions/delete-package-versions@v5
        with:
         owner: ${{ github.repository_owner }}
         package-name: user
         package-type: container
         min-versions-to-keep: 3
         token: ${{ secrets.GITHUB_TOKEN }}

         # 10. Delete older Maven SNAPSHOT versions
      - name: Cleanup old Maven SNAPSHOT versions
        uses: actions/delete-package-versions@v5
        with:
         owner: ${{ github.repository_owner }}
         package-name: YOUR_MAVEN_PACKAGE_NAME
         package-type: maven
         min-versions-to-keep: 1
         delete-only-pre-release-versions: true
         token: ${{ secrets.GITHUB_TOKEN }}
