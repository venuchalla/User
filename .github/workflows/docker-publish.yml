
name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: master-docker-build
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Configure Java and Maven credentials
      - name: Set up Java 19
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'
          cache: maven
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Build and test
      - name: Build Maven application
        run: mvn -B -U clean verify
        env:
          GH_USERNAME: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Get Maven project version
      - name: Get application version
        id: app-version
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate \
            -Dexpression=project.version)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Application version: $VERSION"

      # 5. Configure image name
      - name: Set Docker image name
        id: image-name
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Docker image: $IMAGE"

      # 6. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 8. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image-name.outputs.image }}:${{ steps.app-version.outputs.version }}
            ${{ steps.image-name.outputs.image }}:latest

      # 9. Delete old untagged image versions
      - name: Cleanup old untagged GHCR images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}
