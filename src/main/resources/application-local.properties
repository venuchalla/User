
logging.structured.ecs.service.environment=local

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# H2 Console
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true



# Local Angular development server.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,https://localhost:4200}
app.saml.sp-entity-id=${SAML_SP_ENTITY_ID:http://localhost:8082}
app.saml.acs-url=${SAML_ACS_URL:http://localhost:8082/login/saml2/sso/zitadel}
app.saml.slo-url=${SAML_SLO_URL:http://localhost:8082/saml/slo}
app.saml.frontend-profile-url=${SAML_FRONTEND_PROFILE_URL:https://localhost:4200/saml/profile}
app.saml.frontend-login-error-url=${SAML_FRONTEND_LOGIN_ERROR_URL:https://localhost:4200/saml?error=true}
app.saml.frontend-logout-complete-url=${SAML_FRONTEND_LOGOUT_COMPLETE_URL:https://localhost:4200/home}
app.saml.frontend-origin=${SAML_FRONTEND_ORIGIN:https://localhost:4200}
