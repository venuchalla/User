
logging.structured.ecs.service.environment=local

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Local development tools; never enable these flags in production.
app.dev.h2-console-public=true
app.dev.api-docs-public=true

# Local Angular development server.

app.saml.frontend-origin=${SAML_FRONTEND_ORIGIN:https://localhost:4200,https://localhost:4200}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,https://localhost:4200}


app.saml.sp-entity-id=${SAML_SP_ENTITY_ID:http://localhost:8082}
app.saml.acs-url=${SAML_ACS_URL:http://localhost:8082/login/saml2/sso/zitadel}
app.saml.slo-url=${SAML_SLO_URL:http://localhost:8082/saml/slo}
app.saml.sp-private-key-location=${SAML_SP_PRIVATE_KEY_LOCATION:classpath:certs/saml-sp-private-key.pem}
app.saml.sp-certificate-location=${SAML_SP_CERTIFICATE_LOCATION:classpath:certs/saml-sp-certificate.pem}



# User App
app.callbacks.userapp.success-url=https://localhost:4200/saml/profile
app.callbacks.userapp.error-url=https://localhost:4200/saml?error=true
app.callbacks.userapp.logout-url=https://localhost:4200/saml

# Admin App
app.callbacks.user.success-url=http://localhost:4200/saml/profile
app.callbacks.user.error-url=http://localhost:4200/saml?error=true
app.callbacks.user.logout-url=http://localhost:4200/saml

app.callbacks.default.success-url=http://localhost:4200/saml/profile
app.callbacks.default.error-url=http://localhost:4200/saml?error=true
app.callbacks.default.logout-url=http://localhost:4200/saml


external.api.jsonplaceholder.url=https://jsonplaceholder.typicode.com

spring.cloud.openfeign.client.config.jsonPlaceholderClient.connectTimeout=3000
spring.cloud.openfeign.client.config.jsonPlaceholderClient.readTimeout=5000
spring.cloud.openfeign.client.config.jsonPlaceholderClient.loggerLevel=basic


