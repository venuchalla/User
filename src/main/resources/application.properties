# Select the environment and optionally include additional profiles.
# Examples: active=local (default), include=feign; or active=prod, include=feign.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.profiles.include=${SPRING_PROFILES_INCLUDE:}

server.port=8082
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
app.jwtSecret= userappahdjhfajkdfhadfhjadfjadhfajdsf
app.jwtExpirationMs= 180000

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Shared SAML identity-provider and signing configuration.
app.saml.enabled=${SAML_ENABLED:true}
app.saml.registration-id=${SAML_REGISTRATION_ID:zitadel}
app.saml.idp-metadata-uri=${SAML_IDP_METADATA_URI:https://my-dev-authentication-server-dsealt.us1.zitadel.cloud/saml/v2/metadata}
app.saml.idp-entity-id=${SAML_IDP_ENTITY_ID:https://my-dev-authentication-server-dsealt.us1.zitadel.cloud/saml/v2/metadata}
app.saml.idp-origin=${SAML_IDP_ORIGIN:https://my-dev-authentication-server-dsealt.us1.zitadel.cloud}
# Ask the IdP to reauthenticate instead of silently reusing its existing session.
app.saml.force-authn=${SAML_FORCE_AUTHN:true}
# Backdate logout requests slightly to tolerate clock skew with the IdP.
app.saml.logout-issue-instant-offset-seconds=${SAML_LOGOUT_ISSUE_INSTANT_OFFSET_SECONDS:-5}
# ZITADEL currently returns unsigned POST LogoutResponses; core response correlation is still validated.
app.saml.logout-response-signature-required=${SAML_LOGOUT_RESPONSE_SIGNATURE_REQUIRED:false}
app.saml.sp-private-key-location=${SAML_SP_PRIVATE_KEY_LOCATION:classpath:certs/saml-sp-private-key.pem}
app.saml.sp-certificate-location=${SAML_SP_CERTIFICATE_LOCATION:classpath:certs/saml-sp-certificate.pem}

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.saml2=TRACE
logging.level.org.opensaml=TRACE
logging.level.org.springframework.security.web.FilterChainProxy=TRACE

management.endpoints.web.exposure.include = loggers,health,beans