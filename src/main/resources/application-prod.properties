# Angular frontend hosted on GitHub Pages.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://venuchalla.github.io}
app.saml.frontend-origin=${SAML_FRONTEND_ORIGIN:https://venuchalla.github.io}
app.saml.frontend-profile-url=https://venuchalla.github.io/users-app-angular/saml/profile
app.saml.frontend-login-error-url=https://venuchalla.github.io/users-app-angular/saml?error=true
app.saml.frontend-logout-complete-url=https://venuchalla.github.io/users-app-angular/saml/logout-complete

# These SAML service-provider URLs must be the publicly reachable production backend URLs.
app.saml.sp-entity-id=${SAML_SP_ENTITY_ID:http://localhost:8082}
app.saml.acs-url=${SAML_ACS_URL:http://localhost:8082/login/saml2/sso/zitadel}
app.saml.slo-url=${SAML_SLO_URL:http://localhost:8082/saml/slo}
